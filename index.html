<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3261e">
<title>FiFi EOD Report Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--red:#b3261e;--ink:#1d1b1a;--mut:#6b6461;--line:#e4dedb;--bg:#f7f4f2;--card:#fff;--ok:#1f7a4d;--okbg:#e6f4ec;--bad:#a3341f;--badbg:#fbe9e4}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
header h1{font-size:18px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:0;color:#fff;font-size:30px;line-height:1;padding:0 8px 0 0;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:24px 0 8px}
h3{font-size:15px;margin:22px 0 8px}
small{color:var(--mut);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;align-items:center;gap:8px;cursor:pointer}
.card.col{flex-direction:column;align-items:stretch;cursor:default}
.ct{flex:1;display:flex;flex-direction:column;min-width:0}.ct span{color:var(--mut);font-size:14px}
.chev{color:var(--mut);font-size:22px}
.st{font-size:13px}.st.ok{color:var(--ok)}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut);margin:6px 0}
input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;width:100%}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink)}.chk input{width:22px;height:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:var(--red);color:#fff;font:inherit;font-weight:600;padding:12px 16px;cursor:pointer;margin:6px 6px 6px 0}
.btn.big{width:100%;padding:15px;font-size:17px;margin:8px 0}
.btn.ghost{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:6px 10px;font-size:14px;margin:0}
.btn.danger{background:var(--bad)}
.bar{margin-top:24px}.bar.top{margin-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:0;background:#fff;font:inherit;padding:10px 4px;cursor:pointer;color:var(--mut)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.acc{background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.acch{width:100%;display:flex;gap:8px;align-items:center;border:0;background:none;font:inherit;font-weight:600;padding:14px;cursor:pointer;text-align:left}
.acch span:first-child{flex:1}.cnt{background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;min-width:20px;text-align:center}.cnt:empty{display:none}
.accb{padding:0 12px 12px}
.obs{border:1px solid var(--line);border-radius:10px;margin:6px 0;overflow:hidden}
.obs>button{width:100%;display:flex;gap:10px;align-items:center;border:0;background:#fff;font:inherit;padding:11px 12px;text-align:left;cursor:pointer}
.ic{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:14px;flex:none}
.obs.t .ic{background:var(--okbg);color:var(--ok)}.obs.f .ic{background:var(--badbg);color:var(--bad)}
.obs.on.t{border-color:var(--ok)}.obs.on.f{border-color:var(--bad)}
.obs.on.t>button{background:var(--okbg)}.obs.on.f>button{background:var(--badbg)}
.obs.on .ic{background:currentColor}.obs.on.t .ic{color:var(--ok)}.obs.on.f .ic{color:var(--bad)}
.obs.on .ic::after{content:'';}
.obs.on.t .ic,.obs.on.f .ic{color:#fff}.obs.on.t .ic{background:var(--ok)}.obs.on.f .ic{background:var(--bad)}
.phs{padding:4px 12px 0}
.ph{flex-direction:row;align-items:center;gap:8px}.ph span{min-width:110px}
.prev{font-size:14px;color:var(--mut);background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 12px 10px}
.tog{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;font:inherit;padding:11px 12px;margin:6px 0;cursor:pointer}
.tog::before{content:'○ ';color:var(--mut)}
.tog.on{border-color:var(--ink);background:#f0ecea;font-weight:600}.tog.on::before{content:'● ';color:var(--red)}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.photo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:8px;align-items:center}.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--line)}.pn{font-weight:600}.pf{flex:1;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{color:var(--mut);font-size:14px}
.warn{color:var(--bad);font-size:14px;font-weight:600}
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;font-family:Arial,sans-serif;font-size:14px}
.doc h1{font-size:17px}.doc h2{font-size:15px;text-transform:none;color:var(--ink);letter-spacing:0}.doc h3{font-size:14px}
.doc p{margin:6px 0}.doc p.ind{margin-left:22px}
mark{background:#fff3a0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;transition:transform .25s;z-index:9;max-width:90%;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="bank.js"></script>
<script src="app.js"></script>
</body>
</html>
